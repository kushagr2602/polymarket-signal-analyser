name: scan

# Keeps the deployed dashboard's data fresh without needing a local machine.
# Hourly: a */30 cron on a private repo (~3,600 min/month) blows past GitHub's
# 2,000 free Actions minutes; hourly stays comfortably inside it.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m src.market --refresh-storage   # 5y prices → Supabase Storage, read by the hosted app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - run: python -m src.scheduler --once
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
